<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>TAC Miner</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #050914;
      --bg-soft: #091225;
      --card: #0b1426;
      --card-2: #0e1930;

      --purple: #9b16ff;
      --purple-light: #c56cff;

      --cyan: #19cfff;
      --cyan-light: #72e5ff;

      --green: #18d69e;
      --red: #ff5b75;

      --text: #f5f7fb;
      --muted: #8995aa;
      --border: rgba(65, 139, 210, 0.20);

      --nav-height: 76px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(24, 207, 255, 0.08), transparent 32%),
        radial-gradient(circle at 50% 35%, rgba(155, 22, 255, 0.06), transparent 40%),
        var(--bg);

      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      min-height: 100vh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(var(--nav-height) + 24px);
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;

      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(5, 9, 20, 0.82);

      position: sticky;
      top: 0;
      z-index: 20;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.9),
        0 0 20px rgba(155,22,255,0.35);
    }

    .brand-name {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .top-menu {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      color: #aab5c7;
      font-size: 25px;
      cursor: pointer;
    }

    /* =========================
       USER
    ========================= */

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 20px 4px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;

      border: 2px solid rgba(255,255,255,0.9);
      background: #121b30;

      flex-shrink: 0;
    }

    .user-details {
      min-width: 0;
    }

    .username {
      font-size: 18px;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .level {
      display: inline-flex;
      margin-top: 5px;
      padding: 4px 9px;
      border-radius: 8px;

      background: #17233c;
      color: #d5deed;

      font-size: 11px;
      font-weight: 700;
    }

    .wallet-status {
      border: 1px solid rgba(25,207,255,0.42);
      color: var(--cyan);

      border-radius: 999px;
      padding: 9px 14px;

      font-size: 12px;
      font-weight: 700;

      background: rgba(25,207,255,0.04);
      white-space: nowrap;
    }

    .wallet-status.connected {
      color: var(--green);
      border-color: rgba(24,214,158,0.45);
      background: rgba(24,214,158,0.06);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      text-align: center;
      padding: 25px 20px 8px;
    }

    .hero h1 {
      margin: 0;

      font-size: 31px;
      line-height: 1.1;
      font-weight: 850;
      letter-spacing: -1px;

      background:
        linear-gradient(
          90deg,
          var(--cyan),
          #dcecff 45%,
          #dca5ff
        );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      margin: 9px 0 0;

      color: var(--muted);
      font-size: 15px;
    }

    /* =========================
       MINING CARD
    ========================= */

    .mining-card {
      margin: 18px 16px 0;
      padding: 20px 14px 18px;

      border: 1px solid var(--border);
      border-radius: 26px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(25,207,255,0.055),
          transparent 42%
        ),
        linear-gradient(
          145deg,
          rgba(12,25,47,0.98),
          rgba(6,13,27,0.98)
        );

      box-shadow:
        0 20px 55px rgba(0,0,0,0.25);
    }

    .reward-label {
      text-align: center;

      color: #9aa7ba;
      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .reward-value {
      width: fit-content;
      min-width: 205px;

      margin: 10px auto 18px;
      padding: 10px 18px;

      border-radius: 17px;
      border: 1px solid rgba(25,207,255,0.48);

      background: rgba(4,16,31,0.8);

      color: var(--cyan);
      font-size: 23px;
      font-weight: 850;

      box-shadow:
        0 0 22px rgba(25,207,255,0.10);
    }

    /* =========================
       MINING CIRCLE
    ========================= */

    .mining-circle {
      width: 228px;
      height: 228px;

      margin: 0 auto;

      padding: 11px;

      border-radius: 50%;

      background:
        conic-gradient(
          from 210deg,
          var(--purple),
          #6e2cff 28%,
          var(--cyan) 63%,
          #2785ff 82%,
          var(--purple)
        );

      box-shadow:
        0 0 25px rgba(25,207,255,0.23),
        0 0 35px rgba(155,22,255,0.15);
    }

    .mining-circle.mining {
      animation: ringPulse 2s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% {
        transform: scale(1);
        filter: brightness(1);
      }

      50% {
        transform: scale(1.025);
        filter: brightness(1.16);
      }
    }

    .mining-inner {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 50% 42%,
          #172441 0%,
          #0c162c 52%,
          #050a16 100%
        );

      border: 4px solid #07101f;

      box-shadow:
        inset 0 0 28px rgba(0,0,0,0.55);
    }

    .coin-logo {
      width: 88px;
      height: 88px;

      object-fit: cover;
      border-radius: 50%;

      border: 3px solid white;

      box-shadow:
        0 0 20px rgba(155,22,255,0.38);
    }

    .coin-name {
      margin-top: 10px;

      min-width: 96px;
      padding: 7px 18px;

      border-radius: 999px;

      border: 1px solid rgba(25,207,255,0.42);

      color: var(--cyan);
      background: rgba(3,12,25,0.65);

      font-size: 14px;
      font-weight: 800;
    }

    /* =========================
       MINING STATS
    ========================= */

    .mining-stats {
      display: flex;
      justify-content: center;
      gap: 9px;

      margin-top: 17px;
    }

    .stat-pill {
      padding: 9px 13px;

      border-radius: 999px;

      background: #101d32;
      border: 1px solid rgba(115,143,180,0.14);

      color: #b6c1d2;

      font-size: 13px;
    }

    .stat-pill strong {
      color: white;
    }

    .timer {
      border-color: rgba(24,214,158,0.28);
      color: var(--green);
      background: rgba(24,214,158,0.04);
    }

    /* =========================
       START BUTTON
    ========================= */

    .start-button {
      width: calc(100% - 32px);

      height: 58px;

      margin: 16px 16px 0;

      border: 1px solid rgba(25,207,255,0.45);
      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #142440,
          #101a30
        );

      color: var(--cyan);

      font-size: 17px;
      font-weight: 850;
      letter-spacing: 0.4px;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.22);

      transition:
        transform 0.15s ease,
        background 0.2s ease;
    }

    .start-button:active {
      transform: scale(0.98);
    }

    .start-button.mining {
      color: white;

      border-color: rgba(24,214,158,0.5);

      background:
        linear-gradient(
          135deg,
          #123d38,
          #102a2a
        );
    }

    /* =========================
       ACTIONS
    ========================= */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin: 14px 16px 0;
    }

    .action-button {
      min-height: 57px;

      border-radius: 18px;

      border: 1px solid rgba(115,143,180,0.13);

      background: #101a2b;

      color: #edf2fa;

      font-size: 14px;
      font-weight: 750;

      cursor: pointer;
    }

    .action-icon {
      color: var(--cyan);
      margin-right: 7px;
    }

    /* =========================
       PRICE
    ========================= */

    .price-card {
      margin: 18px 16px 0;
      padding: 17px;

      border-radius: 20px;

      border: 1px solid rgba(25,207,255,0.14);

      background:
        linear-gradient(
          145deg,
          rgba(12,24,45,0.95),
          rgba(8,15,29,0.95)
        );
    }

    .price-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-title {
      color: #aab5c6;
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 1.3px;
    }

    .price-live {
      display: flex;
      align-items: center;
      gap: 5px;

      color: var(--green);
      font-size: 11px;
      font-weight: 750;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 9px rgba(24,214,158,0.7);
    }

    .price-row {
      display: flex;
      align-items: end;
      justify-content: space-between;

      margin-top: 10px;
    }

    .price {
      font-size: 27px;
      font-weight: 850;
      color: white;
    }

    .change {
      font-size: 13px;
      font-weight: 750;
      color: var(--green);
    }

    .change.negative {
      color: var(--red);
    }

    .updated {
      margin-top: 5px;

      color: #66758c;
      font-size: 10px;
    }

    /* =========================
       WALLET
    ========================= */

    .section {
      margin: 24px 16px 0;
    }

    .section-title {
      margin: 0 0 11px 5px;

      color: #aeb8ca;

      font-size: 14px;
      font-weight: 850;

      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .wallet-card {
      padding: 18px;

      border-radius: 21px;

      background:
        linear-gradient(
          145deg,
          #0d192d,
          #091225
        );

      border: 1px solid rgba(90,130,180,0.14);
    }

    .asset-row {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .asset-icon {
      width: 48px;
      height: 48px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid white;
    }

    .asset-label {
      color: #8591a6;
      font-size: 12px;
    }

    .asset-value {
      margin-top: 2px;

      color: white;

      font-size: 21px;
      font-weight: 850;
    }

    .wallet-lines {
      margin-top: 17px;
      padding-top: 15px;

      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .wallet-line {
      display: flex;
      justify-content: space-between;

      padding: 8px 0;

      color: #8995aa;
      font-size: 13px;
    }

    .wallet-line strong {
      color: #eef3fa;
    }

    /* =========================
       OTHER PAGES
    ========================= */

    .page {
      display: none;
      padding: 25px 16px 0;
    }

    .page.active {
      display: block;
    }

    .page h2 {
      margin: 0;

      font-size: 25px;
    }

    .page-subtitle {
      margin-top: 7px;

      color: var(--muted);
      font-size: 14px;
    }

    .feature-card {
      margin-top: 16px;

      padding: 19px;

      border-radius: 20px;

      border: 1px solid rgba(90,130,180,0.15);

      background: #0c172a;
    }

    .feature-card h3 {
      margin: 0 0 8px;

      font-size: 16px;
    }

    .feature-card p {
      margin: 0;

      color: var(--muted);

      line-height: 1.5;
      font-size: 13px;
    }

    .feature-button {
      width: 100%;

      margin-top: 14px;

      padding: 13px;

      border: 1px solid rgba(25,207,255,0.3);
      border-radius: 13px;

      background: #10213a;

      color: var(--cyan);

      font-weight: 750;
    }

    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;

      left: 50%;
      bottom: 10px;

      transform: translateX(-50%);

      width: min(488px, calc(100% - 20px));

      height: var(--nav-height);

      padding: 7px;

      display: grid;
      grid-template-columns: repeat(5, 1fr);

      border-radius: 25px;

      border: 1px solid rgba(100,140,190,0.18);

      background:
        rgba(8,15,28,0.94);

      box-shadow:
        0 15px 45px rgba(0,0,0,0.45);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      z-index: 50;
    }

    .nav-button {
      border: 0;
      background: transparent;

      color: #78859a;

      border-radius: 18px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 4px;

      font-size: 10px;
      font-weight: 750;

      cursor: pointer;
    }

    .nav-icon {
      font-size: 21px;
      line-height: 1;
    }

    .nav-button.active {
      color: var(--cyan);

      background:
        rgba(25,207,255,0.06);
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: 98px;

      transform:
        translate(-50%, 20px);

      opacity: 0;

      pointer-events: none;

      width: min(88%, 390px);

      padding: 12px 16px;

      border-radius: 13px;

      background: #111e34;
      border: 1px solid rgba(25,207,255,0.2);

      color: white;

      text-align: center;

      font-size: 13px;

      z-index: 100;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* =========================
       SMALL SCREENS
    ========================= */

    @media (max-width: 360px) {
      .hero h1 {
        font-size: 27px;
      }

      .mining-circle {
        width: 205px;
        height: 205px;
      }

      .coin-logo {
        width: 78px;
        height: 78px;
      }

      .reward-value {
        font-size: 20px;
      }

      .stat-pill {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =========================
       TOP BAR
  ========================= -->

  <header class="topbar">

    <div class="brand">
      <img
        src="tac-logo.png"
        class="brand-logo"
        alt="TAC"
      >

      <span class="brand-name">TAC</span>
    </div>

    <button
      class="top-menu"
      onclick="showToast('TAC Miner settings coming soon')"
      aria-label="Menu"
    >
      ⋮
    </button>

  </header>


  <!-- =========================
       MINE PAGE
  ========================= -->

  <main id="minePage">

    <!-- USER -->

    <section class="user-row">

      <div class="user-info">

        <img
          id="userAvatar"
          class="avatar"
          src="tac-logo.png"
          alt="User"
        >

        <div class="user-details">

          <div
            id="username"
            class="username"
          >
            User
          </div>

          <div class="level">
            Lv 1
          </div>

        </div>

      </div>

      <div
        id="walletStatus"
        class="wallet-status"
      >
        Not Connected
      </div>

    </section>


    <!-- HERO -->

    <section class="hero">

      <h1>TAC Miner</h1>

      <p>Mine. Earn. Build the Future.</p>

    </section>


    <!-- MINING CARD -->

    <section class="mining-card">

      <div class="reward-label">
        Cycle Reward
      </div>

      <div
        id="reward"
        class="reward-value"
      >
        ⚡ 0.0000 TAC
      </div>


      <!-- MINING CIRCLE -->

      <div
        id="miningCircle"
        class="mining-circle"
      >

        <div class="mining-inner">

          <img
            src="tac-logo.png"
            class="coin-logo"
            alt="TAC Logo"
          >

          <div class="coin-name">
            TAC
          </div>

        </div>

      </div>


      <!-- STATS -->

      <div class="mining-stats">

        <div class="stat-pill">
          Speed:
          <strong id="speed">
            0 TAC/h
          </strong>
        </div>

        <div
          id="timer"
          class="stat-pill timer"
        >
          08:00:00
        </div>

      </div>

    </section>


    <!-- START -->

    <button
      id="startButton"
      class="start-button"
      onclick="toggleMining()"
    >
      START MINING
    </button>


    <!-- ACTIONS -->

    <div class="actions">

      <button
        class="action-button"
        onclick="showToast('Miner marketplace coming soon')"
      >
        <span class="action-icon">▣</span>
        Buy Miners
      </button>

      <button
        class="action-button"
        onclick="showToast('Connect your TON wallet to withdraw')"
      >
        <span class="action-icon">↓</span>
        Withdraw
      </button>

    </div>


    <!-- PRICE -->

    <section class="price-card">

      <div class="price-top">

        <div class="price-title">
          TAC Market Price
        </div>

        <div class="price-live">
          <span class="live-dot"></span>
          LIVE
        </div>

      </div>

      <div class="price-row">

        <div
          id="tacPrice"
          class="price"
        >
          Loading...
        </div>

        <div
          id="priceChange"
          class="change"
        >
          --
        </div>

      </div>

      <div
        id="priceUpdated"
        class="updated"
      >
        Updating from CryptoRank...
      </div>

    </section>


    <!-- WALLETS -->

    <section class="section">

      <h2 class="section-title">
        Your Wallets
      </h2>

      <div class="wallet-card">

        <div class="asset-row">

          <img
            src="tac-logo.png"
            class="asset-icon"
            alt="TAC"
          >

          <div>

            <div class="asset-label">
              Total Assets
            </div>

            <div class="asset-value">
              <span id="totalAssets">0.0000</span> TAC
            </div>

          </div>

        </div>


        <div class="wallet-lines">

          <div class="wallet-line">
            <span>Holding Wallet</span>
            <strong>0.0000 TAC</strong>
          </div>

          <div class="wallet-line">
            <span>Pool Wallet</span>
            <strong>0.0000 TAC</strong>
          </div>

          <div class="wallet-line">
            <span>Wallet Status</span>
